[binaries]
c = '/opt/homebrew/opt/llvm/bin/clang'
cpp = '/opt/homebrew/opt/llvm/bin/clang++'

[built-in options]
# Homebrew LLVM's libc++ is stricter than Apple's: it does not include
# <iosfwd> (std::istream declaration) transitively through <memory> or
# <functional>. The manifold subproject relies on that transitive include.
# Force-including iosfwd globally patches that without touching subproject files.
cpp_args = ['-include', 'iosfwd']
