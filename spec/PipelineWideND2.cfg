(***************************************************************************)
(* Wide config plus a second disassembly worker (ND = 2): the only       *)
(* committed config that can tell disassembly workers apart, so the only *)
(* one that exercises token-holder identity on the D tier                *)
(* (WorkersHoldTokens) rather than just holder counts. ~1.3M states,     *)
(* ~5 min -- the slow one; the plain Wide config stays for fast signal.  *)
(* Run with: tlc2.TLC -config PipelineWideND2.cfg Pipeline              *)
(***************************************************************************)
SPECIFICATION Spec
CONSTANT NA = 2
CONSTANT ND = 2
CONSTANT BudgetTotal = 2
CONSTANT K = 3
CONSTANT MaxQ = 2
CONSTANT MaxR = 2
INVARIANT TypeOK
INVARIANT BudgetConservation
INVARIANT WorkersHoldTokens
INVARIANT PairingA
INVARIANT AssemblyConservation
INVARIANT SubmittedEqualsCompleted
INVARIANT DisasmConservation
INVARIANT OrderedDelivery
INVARIANT QueueBounded
INVARIANT ReorderBounded
INVARIANT WindowBounded
INVARIANT CleanShutdown
PROPERTY AllTerminate
