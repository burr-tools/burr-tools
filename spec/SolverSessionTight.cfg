(***************************************************************************)
(* Low-budget tight config: 2 producers competing for 1 shared budget      *)
(* token with queue capacity 1 and up to 2 pause/resume cycles. Forces     *)
(* budget contention + soft-cap lifting on nearly every step.             *)
(***************************************************************************)
SPECIFICATION Spec
CONSTANT P = 2
CONSTANT BudgetTotal = 1
CONSTANT K = 3
CONSTANT Cap = 1
CONSTANT MaxPauses = 2
INVARIANT TypeOK
INVARIANT StateMachineOK
INVARIANT QueueSoftBounded
INVARIANT ItemConservation
INVARIANT NoDuplicateDelivery
INVARIANT BudgetConservation
INVARIANT CleanShutdown
INVARIANT AbortTotal
PROPERTY AllTerminate
