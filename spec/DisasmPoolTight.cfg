(***************************************************************************)
(* Tight-bounds config: a queue of 1 forces the queue-full submit wait     *)
(* (the pool's only backpressure) on nearly every step. Run with:          *)
(*   tlc2.TLC -config DisasmPoolTight.cfg DisasmPool                       *)
(***************************************************************************)
SPECIFICATION Spec
CONSTANT M = 2
CONSTANT NSubmits = 4
CONSTANT MaxQ = 1
INVARIANT TypeOK
INVARIANT NoDuplicateDelivery
INVARIANT SalvageSuffix
INVARIANT GapFree
INVARIANT QueueBounded
INVARIANT OfferConservation
INVARIANT SeqConservation
INVARIANT SalvageOrdered
INVARIANT CleanShutdown
PROPERTY AllTerminate
