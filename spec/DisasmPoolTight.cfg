(***************************************************************************)
(* Tight-bounds config: queue and reorder window of 1 force every          *)
(* backpressure path (queue-full submit waits, reorder-file waits, merger  *)
(* skip pacing) on nearly every step. Run with:                            *)
(*   tlc2.TLC -config DisasmPoolTight.cfg DisasmPool                       *)
(***************************************************************************)
SPECIFICATION Spec
CONSTANT M = 2
CONSTANT NSubmits = 4
CONSTANT MaxQ = 1
CONSTANT MaxR = 1
INVARIANT TypeOK
INVARIANT OrderedDelivery
INVARIANT QueueBounded
INVARIANT ReorderBounded
INVARIANT WindowBounded
INVARIANT OfferConservation
INVARIANT SeqConservation
INVARIANT SalvageOrdered
INVARIANT CleanShutdown
PROPERTY AllTerminate
