(***************************************************************************)
(* Low-budget config: a single token for two workers forces the parking    *)
(* path (ThreadBudget::acquire park + the pool re-check/release) on every  *)
(* task. This is the configuration that exercises SPEC-BUDGET-1/2 and the  *)
(* token-free-wait deadlock rule. Run with:                                *)
(*   tlc2.TLC -config AssemblyPoolLowBudget.cfg AssemblyPool               *)
(***************************************************************************)
SPECIFICATION Spec
CONSTANT N = 2
CONSTANT BudgetTotal = 1
CONSTANT NumTasks = 3
CONSTANT MaxPush = 2
INVARIANT TypeOK
INVARIANT BudgetConservation
INVARIANT ActiveBounded
INVARIANT Pairing
INVARIANT TaskConservation
INVARIANT NoStranded
INVARIANT GenShape
INVARIANT NoPartialResume
INVARIANT CleanExit
PROPERTY AllTerminate
