name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Update package list
      run: sudo apt-get update
    
    - name: Install dependencies
      run: sudo apt-get install -y libboost-all-dev meson ninja-build build-essential freeglut3-dev libgl-dev libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev cppcheck
    
    - name: Install just
      uses: extractions/setup-just@v2
    
    - name: Setup build directory
      # -Db_ndebug=true is load-bearing, not cosmetic: without it Meson
      # injects _GLIBCXX_ASSERTIONS and leaves bt_assert live, which costs
      # ~15-30% solver time in the exact-cover hot loops (every
      # vector::operator[] gains a bounds check). Shipped binaries must not
      # carry that. See design/2026-09-24-benchmark-speedup-analysis.md §7.
      run: meson setup build --buildtype=release --werror -Db_ndebug=true
    
    - name: Build
      run: just build
    
    - name: Run tests
      run: just test-all
    
    - name: Run static analysis
      run: just check
    
    - name: Strip binaries
      run: strip build/burrtools build/burrTxt build/burrTxt2
    
    - name: Extract version
      id: version
      run: |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
    
    - name: Package Linux binaries
      run: |
        mkdir -p artifacts/linux
        cp build/burrtools build/burrTxt build/burrTxt2 artifacts/linux/
        cp -r examples artifacts/linux/
        cd artifacts/linux
        tar czf ../burrtools-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz *
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-linux
        path: artifacts/burrtools-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz

  # Builds the project with Clang on x86-64. GCC-only constructs — most notably
  # `#pragma GCC target(...)`, which Clang parses as an unknown pragma and
  # ignores — compile cleanly on every other job in this workflow: the Linux and
  # Windows jobs use GCC, and the macOS runner is arm64, where the x86 intrinsic
  # blocks are excluded by the preprocessor. Without this job an x86-64 Clang
  # build can break with no CI signal at all.
  #
  # --werror is deliberate: meson applies it to this project only, not to
  # subprojects, and the ignored-pragma warnings are themselves the early signal.
  clang-x86-64:
    name: Clang x86-64 build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y clang libboost-all-dev meson ninja-build build-essential freeglut3-dev libgl-dev libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev

    - name: Setup build directory
      env:
        CC: clang
        CXX: clang++
      run: meson setup build-clang --buildtype=release --werror

    - name: Build
      run: ninja -C build-clang

    - name: Run tests
      run: meson test -C build-clang --suite fast --print-errorlogs

  # Runs the parallel solver under ThreadSanitizer.
  #
  # Note the tag: `[parallel]` includes the symmetry-breaking case in
  # test/test_solver.cpp. Puzzles without a symmetry breaker never call
  # assembly_c::smallerRotationExists() from a worker thread, so a TSan run over
  # only those puzzles reports zero races while real ones remain — keep at least
  # one symmetry-breaking puzzle in this tag.
  #
  # exitcode=1 with halt_on_error=0 reports every race and then fails the job.
  # timeout-minutes guards against a lost wakeup in the solver or disassembler
  # pool hanging the runner rather than failing it.
  tsan-parallel:
    name: ThreadSanitizer (parallel solver)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y libboost-all-dev meson ninja-build build-essential freeglut3-dev libgl-dev libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Build with ThreadSanitizer
      run: just build-tsan

    - name: Run parallel solver tests under ThreadSanitizer
      env:
        TSAN_OPTIONS: "halt_on_error=0 exitcode=1 second_deadlock_stack=1 history_size=7"
      run: ./build-tsan/test_burrtools "[parallel]" --reporter compact

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y libboost-all-dev meson ninja-build build-essential freeglut3-dev libgl-dev libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev gcovr

    - name: Install just
      uses: extractions/setup-just@v2

    # `shell: bash` sets pipefail, so a gcovr failure is not masked by tee's
    # exit status.
    - name: Report coverage and generate HTML report
      shell: bash
      run: just coverage-html | tee coverage-summary.txt

    # Uploaded before the report body is built, so the body can link to it:
    # the artifact-url output does not exist until the upload has run.
    - name: Upload HTML coverage report
      id: coverage_artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: coverage-html/

    - name: Build the coverage report body
      env:
        ARTIFACT_URL: ${{ steps.coverage_artifact.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        {
          echo "## Test coverage"
          echo
          echo '```'
          grep -E '^(lines|functions|branches):' coverage-summary.txt
          echo '```'
          echo
          echo "Measured on ubuntu-latest with gcc. Coverage numbers are"
          echo "toolchain-specific, so this Linux figure is the canonical one for"
          echo "comparing across pull requests."
          echo
          # artifact-url is empty if the upload was skipped or failed; fall
          # back to the run, which lists whatever artifacts do exist.
          if [ -n "$ARTIFACT_URL" ]; then
            echo "Per-file breakdown: [coverage-html artifact]($ARTIFACT_URL)."
          else
            echo "Per-file breakdown: the coverage-html artifact on [this run]($RUN_URL)."
          fi
          echo "It is a zip -- GitHub does not serve artifact HTML directly, so"
          echo "download it and open index.html."
        } > coverage-report.md
        cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

    # A pull request from a fork is given a read-only token, so posting a
    # comment is not possible there. Those runs still get the same report in
    # the run summary written above.
    - name: Comment the coverage report on the pull request
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
           --body-file coverage-report.md --edit-last --create-if-none


  # Builds the Doxygen API reference and, on master, publishes it to GitHub
  # Pages at https://burr-tools.github.io/burr-tools/.
  #
  # Gated to pull requests and master, matching `coverage` above. That is not
  # just symmetry: the `release` job downloads *every* artifact of the run into
  # one directory and attaches `artifacts/**/*` to the release, so a pages
  # artifact present on a tag run would end up as a release asset.
  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # `just docs` stamps the docs with `git describe --tags`, which needs
        # the tags and enough history to find the most recent one.
        fetch-depth: 0

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y doxygen graphviz

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Generate API documentation
      run: just docs

    - name: Upload the Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: gendoc/html


  # Split from `docs` because deployment needs write access to Pages and an id
  # token, and a pull request from a fork must not be handed either. Keeping the
  # generation step in its own read-only job means forks still get their docs
  # build checked; only this job, which never runs for a pull request, deploys.
  deploy-docs:
    needs: docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    # GitHub Pages accepts one deployment at a time. Queue rather than cancel,
    # so a rapid second push to master cannot leave the site showing the older
    # of the two commits.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4


  build-windows:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Update package list
      run: sudo apt-get update
    
    - name: Install dependencies
      run: sudo apt-get install -y meson ninja-build mingw-w64 wine
    
    - name: Setup build directory
      # -Db_ndebug=true: shipped binaries must not carry _GLIBCXX_ASSERTIONS
      # / live bt_assert checks (~15-30% solver overhead, see the Linux job
      # comment and design/2026-09-24-benchmark-speedup-analysis.md §7).
      run: meson setup build-win --cross-file cross-mingw64.txt --buildtype=release --werror -Db_ndebug=true -Dpython=disabled
    
    - name: Build
      run: ninja -C build-win

    # This job cross-compiles with MinGW on a Linux runner, so the test binary
    # is a Windows executable that the runner cannot execute directly.
    # cross-mingw64.txt sets exe_wrapper = 'wine', so meson runs it through
    # Wine. Both suites must pass before anything is stripped or packaged.
    - name: Run tests
      env:
        WINEDEBUG: -all
      run: meson test -C build-win --suite fast --suite slow --print-errorlogs

    - name: Strip binaries
      run: x86_64-w64-mingw32-strip build-win/burrtools.exe build-win/burrTxt.exe build-win/burrTxt2.exe
    
    - name: Extract version
      id: version
      run: |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
    
    - name: Package Windows binaries
      run: |
        mkdir -p artifacts/windows
        cp build-win/burrtools.exe build-win/burrTxt.exe build-win/burrTxt2.exe artifacts/windows/
        cp -r examples artifacts/windows/
        cp README.md COPYING artifacts/windows/
        cd artifacts/windows
        zip -r ../burrtools-${{ steps.version.outputs.version }}-windows-x86_64.zip *
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-windows
        path: artifacts/burrtools-${{ steps.version.outputs.version }}-windows-x86_64.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Install dependencies
      run: brew install meson ninja boost
    
    - name: Install just
      uses: extractions/setup-just@v2
    
    - name: Setup build directory
      # -Db_ndebug=true: shipped binaries must not carry _GLIBCXX_ASSERTIONS
      # / live bt_assert checks (~15-30% solver overhead, see the Linux job
      # comment and design/2026-09-24-benchmark-speedup-analysis.md §7).
      run: meson setup build --buildtype=release --werror -Db_ndebug=true
    
    - name: Build
      run: just build

    - name: Run tests
      run: just test-all

    # The menu-table drift check. This is the only job that runs it, because
    # it is the only place the two-table hazard exists: the macOS table is
    # compiled in only under __APPLE__, so off macOS the check compares the
    # portable table with itself and can never fail. It needs the GUI binary,
    # which is why it sits after `just build` rather than next to `just check`.
    - name: Check menu tables (GUI self-check)
      run: just check-gui

    - name: Strip binaries
      run: strip -x build/burrtools build/burrTxt build/burrTxt2
    
    - name: Extract version
      id: version
      run: |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
    
    - name: Create macOS App Bundle and DMG
      run: |
        chmod +x scripts/create-macos-bundle.sh
        ./scripts/create-macos-bundle.sh
    
    - name: Package macOS binaries
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir -p artifacts/macos
        # Tag every artifact with the architecture it was built for. The macOS
        # runner is arm64, so these must not be published under bare or x86_64
        # names that Intel and Linux users would reasonably download.
        ARCH="$(uname -m)"
        # Copy DMG if it exists
        if [ -f "BurrTools-${VERSION}-macos-${ARCH}.dmg" ]; then
          cp "BurrTools-${VERSION}-macos-${ARCH}.dmg" artifacts/macos/
        fi
        # Copy command-line tools
        cp build/burrTxt "artifacts/macos/burrTxt-${VERSION}-macos-${ARCH}"
        cp build/burrTxt2 "artifacts/macos/burrTxt2-${VERSION}-macos-${ARCH}"
        # Copy app bundle if it exists
        if [ -d "BurrTools.app" ]; then
          zip -r "artifacts/macos/BurrTools-${VERSION}-macos-${ARCH}-app.zip" BurrTools.app
        else
          # Fallback: create tar.gz with binaries and examples
          mkdir -p temp-macos
          cp build/burrtools build/burrTxt build/burrTxt2 temp-macos/
          cp -r examples temp-macos/
          tar czf "artifacts/macos/burrtools-${VERSION}-macos-${ARCH}.tar.gz" -C temp-macos .
        fi
    
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-macos
        path: artifacts/macos/*

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get version
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Generate release notes
      id: release_notes
      run: |
        # Extract release notes from NEWS file
        awk '/^-{5,}/{if(++count==1)next; if(count==2)exit} count==1' NEWS > notes.md
        echo "" >> notes.md
        echo "## Downloads" >> notes.md
        echo "" >> notes.md
        echo "See the Assets section below for platform-specific downloads." >> notes.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: BurrTools ${{ steps.get_version.outputs.version }}
        body_path: notes.md
        draft: false
        prerelease: false
        files: |
          artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
