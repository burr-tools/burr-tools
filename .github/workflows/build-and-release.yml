name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Update package list
      run: sudo apt-get update
    
    - name: Install dependencies
      run: sudo apt-get install -y libboost-all-dev meson ninja-build build-essential freeglut3-dev libgl-dev libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev libcurl4-openssl-dev cppcheck
    
    - name: Install just
      uses: extractions/setup-just@v2
    
    - name: Setup build directory
      # -Db_ndebug=true is load-bearing, not cosmetic: without it Meson
      # injects _GLIBCXX_ASSERTIONS and leaves bt_assert live, which costs
      # ~15-30% solver time in the exact-cover hot loops (every
      # vector::operator[] gains a bounds check). Shipped binaries must not
      # carry that. See design/2026-09-24-benchmark-speedup-analysis.md §7.
      run: meson setup build --buildtype=release --werror -Db_ndebug=true
    
    - name: Build
      run: just build
    
    - name: Run tests
      run: just test-all
    
    # The full meson test log (meson truncates failing output to 100 lines
    # in the job log, which routinely hides the actual assertion). Only
    # uploaded on failure to keep green runs artifact-free.
    - name: Upload test log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-testlog-linux
        path: build/meson-logs/testlog.txt
    
    # The redesigned GUI's hot paths in src/uicore (test/bench_ui.cpp),
    # measured on this release build. A report, not a gate: shared runners
    # vary too much to fail on time.
    - name: Micro-benchmarks (report)
      continue-on-error: true
      shell: bash
      run: |
        ./build/test_burrtools "[bench]" --benchmark-samples 20 --benchmark-no-analysis | tee bench.txt
        { echo "## Micro-benchmarks (src/uicore, release)"; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: Run static analysis
      run: just check
    
    - name: Strip binaries
      run: strip build/burrtools build/burrTxt build/burrTxt2
    
    - name: Extract version
      id: version
      run: |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
    
    - name: Package Linux binaries
      run: |
        mkdir -p artifacts/linux
        cp build/burrtools build/burrTxt build/burrTxt2 artifacts/linux/
        cp -r examples artifacts/linux/
        cd artifacts/linux
        tar czf ../burrtools-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz *
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-linux
        path: artifacts/burrtools-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz

  # Builds the project with Clang on x86-64. GCC-only constructs — most notably
  # `#pragma GCC target(...)`, which Clang parses as an unknown pragma and
  # ignores — compile cleanly on every other job in this workflow: the Linux and
  # Windows jobs use GCC, and the macOS runner is arm64, where the x86 intrinsic
  # blocks are excluded by the preprocessor. Without this job an x86-64 Clang
  # build can break with no CI signal at all.
  #
  # --werror is deliberate: meson applies it to this project only, not to
  # subprojects, and the ignored-pragma warnings are themselves the early signal.
  clang-x86-64:
    name: Clang x86-64 build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y clang libboost-all-dev meson ninja-build build-essential freeglut3-dev libgl-dev libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev libcurl4-openssl-dev

    - name: Setup build directory
      env:
        CC: clang
        CXX: clang++
      run: meson setup build-clang --buildtype=release --werror

    - name: Build
      run: ninja -C build-clang

    - name: Run tests
      run: meson test -C build-clang --suite fast --print-errorlogs

  # Runs the parallel solver under ThreadSanitizer.
  #
  # Note the tag: `[parallel]` includes the symmetry-breaking case in
  # test/test_solver.cpp. Puzzles without a symmetry breaker never call
  # assembly_c::smallerRotationExists() from a worker thread, so a TSan run over
  # only those puzzles reports zero races while real ones remain — keep at least
  # one symmetry-breaking puzzle in this tag.
  #
  # exitcode=1 with halt_on_error=0 reports every race and then fails the job.
  # timeout-minutes guards against a lost wakeup in the solver or disassembler
  # pool hanging the runner rather than failing it.
  tsan-parallel:
    name: ThreadSanitizer (parallel solver)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y libboost-all-dev meson ninja-build build-essential freeglut3-dev libgl-dev libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev libcurl4-openssl-dev

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Build with ThreadSanitizer
      run: just build-tsan

    - name: Run parallel solver tests under ThreadSanitizer
      env:
        TSAN_OPTIONS: "halt_on_error=0 exitcode=1 second_deadlock_stack=1 history_size=7"
      run: ./build-tsan/test_burrtools "[parallel]" --reporter compact

  # AddressSanitizer and UndefinedBehaviorSanitizer over the unit tests and
  # the Qt GUI's suites (renders included, on lavapipe as in qt-linux). Qt
  # and the Mesa driver are not instrumented and keep memory to the end, so
  # leaks are checked in test_burrtools only.
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-all-dev ninja-build build-essential cmake freeglut3-dev libgl-dev \
          libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev libcurl4-openssl-dev \
          libxkbcommon-dev libxkbcommon-x11-0 libegl1 libfontconfig1 libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools \
          xvfb libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
        pip install --user "meson>=1.7"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        modules: 'qtshadertools'
        cache: true

    - name: Find lavapipe
      run: |
        icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
        echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

    - name: Build with ASan and UBSan
      run: |
        meson setup build-asan --buildtype=debug -Db_sanitize=address,undefined -Db_lundef=false \
          -Dqt_gui=enabled -Dpython=disabled
        ninja -C build-asan

    - name: Unit tests, leaks included
      env:
        ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1:strict_string_checks=1"
        UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      run: ./build-asan/test_burrtools --reporter compact

    - name: Qt GUI suites
      env:
        ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0"
        UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        BURRTOOLS_TEST_QPA: xcb
        BURRTOOLS_OFFSCREEN_RHI: vulkan
        BURRTOOLS_REQUIRE_GPU_TESTS: '1'
      run: xvfb-run -a meson test -C build-asan --print-errorlogs qtgui qtgui_qml qtgui_gallery_150 qtgui_gallery_200 qtgui_smoke

    - name: Upload the test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: sanitizers-testlog
        path: build-asan/meson-logs/testlog.txt
        if-no-files-found: ignore
  # The TLA+ check is deterministic in its inputs (pinned tools, hermetic
  # models): unchanged inputs reproduce the previous result bit-for-bit.
  # spec/** carries the models, but the justfile defines the recipes
  # (tla_version, spec-lint, the TLC config list), so a justfile change
  # can break this job with spec/** untouched -- and the justfile is
  # touched far more often than the specs. Gate the expensive job on all
  # paths that can change its outcome.
  spec-changes:
    name: Detect spec changes
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.filter.outputs.spec }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check changed paths
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          spec:
            - 'spec/**'
            - 'justfile'
            - '.github/workflows/build-and-release.yml'

  # Model-checks the PlusCal protocol specs in spec/ with TLC. It guards
  # the defect class TSan cannot see — lost wakeups, hangs, token leaks —
  # at the protocol level, before those shapes reach the C++ implementation.
  spec:
    name: TLA+ protocol specs
    needs: spec-changes
    # Tags and manual dispatches have no diff base for the filter, so they
    # run unconditionally; PRs and pushes run only on spec/** changes.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.spec-changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    - name: Install just
      uses: extractions/setup-just@v2

    # The jar is pinned in the justfile (tla_version). The cache key
    # hashes the justfile, so any pin change misses and refetches (~2MB);
    # a static version key would silently keep serving the old jar.
    - name: Cache TLA+ tools
      uses: actions/cache@v4
      with:
        path: build-tla/tla2tools.jar
        key: tla2tools-${{ hashFiles('justfile') }}

    - name: Translate and model-check protocol specs
      run: |
        just spec-check
        # spec-check re-translates in place, so without this the committed
        # translation could drift from the PlusCal while CI stays green.
        git diff --exit-code -- spec/ || { echo "::error::committed PlusCal translation is stale; run just spec-check and commit spec/"; exit 1; }

  # Coverage in two jobs, so that the library's figure -- the one compared
  # across pull requests -- never depends on installing Qt: `coverage`
  # builds without the Qt GUI and measures the library and src/uicore (its
  # [ui] cases); `coverage-qt` builds the Qt GUI and measures src/qtgui's
  # C++. `coverage-report` puts both in one comment, the Qt GUI's part only
  # when its job got that far.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    outputs:
      html-url: ${{ steps.coverage_artifact.outputs.artifact-url }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y libboost-all-dev meson ninja-build build-essential freeglut3-dev libgl-dev libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev libcurl4-openssl-dev gcovr

    - name: Install just
      uses: extractions/setup-just@v2

    # Configured without the Qt GUI, even where a Qt is found. `shell: bash`
    # sets pipefail, so a gcovr failure is not masked by tee's exit status.
    - name: Report coverage and generate HTML report
      shell: bash
      run: |
        meson setup build-cov -Db_coverage=true -Dqt_gui=disabled
        just coverage-html | tee coverage-summary.txt

    - name: Upload the coverage summary
      uses: actions/upload-artifact@v4
      with:
        name: coverage-summary
        path: coverage-summary.txt

    - name: Upload the coverage test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-testlog
        path: build-cov/meson-logs/testlog.txt
        if-no-files-found: ignore

    - name: Upload HTML coverage report
      id: coverage_artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: coverage-html/

  coverage-qt:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    outputs:
      html-url: ${{ steps.coverage_artifact.outputs.artifact-url }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Update package list
      run: sudo apt-get update

    # The Qt GUI's packages as in qt-linux; meson >= 1.7 from pip, which
    # that GUI needs (Ubuntu's is older).
    - name: Install dependencies
      run: |
        sudo apt-get install -y libboost-all-dev ninja-build build-essential cmake freeglut3-dev libgl-dev \
          libglu1-mesa-dev libpng-dev mesa-common-dev zlib1g-dev libcurl4-openssl-dev gcovr \
          libxkbcommon-dev libxkbcommon-x11-0 libegl1 libfontconfig1 libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools \
          xvfb libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
        pip install --user "meson>=1.7"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        modules: 'qtshadertools'
        cache: true

    # Mesa's software Vulkan driver (lavapipe), found rather than named: its
    # manifest's file name has changed between Mesa releases. The summary
    # shows in the log which Vulkan device the render tests will get.
    - name: Find lavapipe
      run: |
        ls /usr/share/vulkan/icd.d/
        icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
        echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
        VK_DRIVER_FILES="$icd" vulkaninfo --summary

    - name: Install just
      uses: extractions/setup-just@v2

    # The Qt suites' render tests run as in qt-linux: Vulkan on Mesa's
    # lavapipe, test_qtgui as "xcb" on Xvfb.
    - name: Report coverage and generate HTML report
      shell: bash
      env:
        BURRTOOLS_TEST_QPA: xcb
        BURRTOOLS_OFFSCREEN_RHI: vulkan
        BURRTOOLS_REQUIRE_GPU_TESTS: '1'
        VK_LOADER_DEBUG: error
      run: |
        meson setup build-cov -Db_coverage=true -Dqt_gui=enabled
        xvfb-run -a just coverage-html | tee coverage-summary.txt

    - name: Upload the coverage summary
      uses: actions/upload-artifact@v4
      with:
        name: coverage-summary-qt
        path: coverage-summary.txt

    - name: Upload the coverage test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-testlog-qt
        path: build-cov/meson-logs/testlog.txt
        if-no-files-found: ignore

    - name: Upload HTML coverage report
      id: coverage_artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html-qt
        path: coverage-html/

  coverage-report:
    runs-on: ubuntu-latest
    needs: [coverage, coverage-qt]
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pull-requests: write
    steps:
    # each summary in its own folder; one is missing when its job failed
    - name: Download the coverage summaries
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-summary*
        path: summaries

    # No report without the library's figure. The Qt GUI's is the block from
    # its "== Qt GUI" line on, in the Qt job's summary.
    - name: Build the coverage report body
      env:
        HTML_URL: ${{ needs.coverage.outputs.html-url }}
        HTML_QT_URL: ${{ needs.coverage-qt.outputs.html-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        lib=summaries/coverage-summary/coverage-summary.txt
        qt=summaries/coverage-summary-qt/coverage-summary.txt
        if [ ! -f "$lib" ]; then
          echo "::warning::no coverage summary: the coverage job failed"
          exit 0
        fi
        link() {   # artifact-url is empty when the upload was skipped or failed
          if [ -n "$2" ]; then echo "[$1]($2)"; else echo "$1 on [this run]($RUN_URL)"; fi
        }
        {
          echo "## Test coverage"
          echo
          echo '```'
          grep -E '^(== |lines:|functions:|branches:)' "$lib"
          if [ -f "$qt" ]; then
            sed -n '/^== Qt GUI/,$p' "$qt" | grep -E '^(== |lines:|functions:|branches:)'
          fi
          echo '```'
          echo
          if [ ! -f "$qt" ]; then
            echo "The Qt GUI's figure is missing: the coverage-qt job did not finish ([run]($RUN_URL))."
            echo
          fi
          echo "Measured on ubuntu-latest with gcc. Coverage numbers are"
          echo "toolchain-specific, so this Linux figure is the canonical one for"
          echo "comparing across pull requests -- the library's, the first block,"
          echo "from a build without Qt. src/uicore is measured by its own [ui]"
          echo "cases; src/qtgui's C++ (not its QML) by the Qt suites, in a job of"
          echo "its own."
          echo
          echo "Per-file breakdown: $(link coverage-html "$HTML_URL"), and for the Qt GUI"
          echo "$(link coverage-html-qt "$HTML_QT_URL"). Each is a zip -- GitHub does not"
          echo "serve artifact HTML directly, so download it and open index.html."
        } > coverage-report.md
        cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

    # A pull request from a fork is given a read-only token, so posting a
    # comment is not possible there. Those runs still get the same report in
    # the run summary written above.
    - name: Comment the coverage report on the pull request
      if: hashFiles('coverage-report.md') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
           --body-file coverage-report.md --edit-last --create-if-none


  # Builds the Doxygen API reference and, on master and release tags, publishes
  # it to GitHub Pages at https://burr-tools.github.io/burr-tools/.
  #
  # Release tags are included because the docs are stamped with
  # `git describe --tags`. A release is tagged after its commit has landed on
  # master, so the master run stamps the site `vX.Y.Z-N-g<sha>`; only the tag
  # run can stamp it with the release version.
  docs:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # `just docs` stamps the docs with `git describe --tags`, which needs
        # the tags and enough history to find the most recent one.
        fetch-depth: 0

    - name: Update package list
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install -y doxygen graphviz

    - name: Install just
      uses: extractions/setup-just@v2

    - name: Generate API documentation
      run: just docs

    - name: Upload the Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: gendoc/html

    # A tag run publishes only when the tagged commit is still master's tip.
    # Tagging an older commit, or tagging after master has moved on, would
    # otherwise replace the current docs with an older tree.
    - name: Decide whether to publish
      id: publish
      run: |
        if [ "$GITHUB_EVENT_NAME" != push ]; then
          publish=false
        elif [ "$GITHUB_REF" = refs/heads/master ]; then
          publish=true
        elif [ "$GITHUB_SHA" = "$(git rev-parse origin/master)" ]; then
          publish=true
        else
          publish=false
          echo "Tagged commit is not master's tip; leaving the published docs alone."
        fi
        echo "publish=$publish" >> "$GITHUB_OUTPUT"


  # Split from `docs` because deployment needs write access to Pages and an id
  # token, and a pull request from a fork must not be handed either. Keeping the
  # generation step in its own read-only job means forks still get their docs
  # build checked; only this job, which never runs for a pull request, deploys.
  #
  # The github-pages environment accepts deployments from `master` and from
  # `v*.*.*` tags; a tag added to the trigger list must also be allowed there.
  deploy-docs:
    needs: docs
    runs-on: ubuntu-latest
    if: needs.docs.outputs.publish == 'true'
    permissions:
      pages: write
      id-token: write
    # GitHub Pages accepts one deployment at a time. Queue rather than cancel,
    # so a rapid second push to master cannot leave the site showing the older
    # of the two commits.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4


  build-windows:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Update package list
      run: sudo apt-get update
    
    - name: Install dependencies
      run: sudo apt-get install -y meson ninja-build mingw-w64 wine
    
    - name: Setup build directory
      # -Db_ndebug=true: shipped binaries must not carry _GLIBCXX_ASSERTIONS
      # / live bt_assert checks (~15-30% solver overhead, see the Linux job
      # comment and design/2026-09-24-benchmark-speedup-analysis.md §7).
      run: meson setup build-win --cross-file cross-mingw64.txt --buildtype=release --werror -Db_ndebug=true -Dpython=disabled
    
    - name: Build
      run: ninja -C build-win

    # This job cross-compiles with MinGW on a Linux runner, so the test binary
    # is a Windows executable that the runner cannot execute directly.
    # cross-mingw64.txt sets exe_wrapper = 'wine', so meson runs it through
    # Wine. Both suites must pass before anything is stripped or packaged.
    - name: Run tests
      env:
        WINEDEBUG: -all
      run: meson test -C build-win --suite fast --suite slow --print-errorlogs

    # Full meson test log on failure (see Linux job comment): meson cuts a
    # failing test's output to its last 100 lines in the job log, which
    # hides the Catch2 assertion -- and this job runs under Wine on a small
    # runner, where timing-dependent failures are hardest to reproduce.
    - name: Upload test log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-testlog-windows
        path: build-win/meson-logs/testlog.txt

    - name: Strip binaries
      run: x86_64-w64-mingw32-strip build-win/burrtools.exe build-win/burrTxt.exe build-win/burrTxt2.exe
    
    - name: Extract version
      id: version
      run: |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
    
    - name: Package Windows binaries
      run: |
        mkdir -p artifacts/windows
        cp build-win/burrtools.exe build-win/burrTxt.exe build-win/burrTxt2.exe artifacts/windows/
        cp -r examples artifacts/windows/
        cp README.md COPYING artifacts/windows/
        cd artifacts/windows
        zip -r ../burrtools-${{ steps.version.outputs.version }}-windows-x86_64.zip *
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-windows
        path: artifacts/burrtools-${{ steps.version.outputs.version }}-windows-x86_64.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Install dependencies
      run: brew install meson ninja boost
    
    - name: Install just
      uses: extractions/setup-just@v2
    
    - name: Setup build directory
      # -Db_ndebug=true: shipped binaries must not carry _GLIBCXX_ASSERTIONS
      # / live bt_assert checks (~15-30% solver overhead, see the Linux job
      # comment and design/2026-09-24-benchmark-speedup-analysis.md §7).
      run: meson setup build --buildtype=release --werror -Db_ndebug=true
    
    - name: Build
      run: just build

    - name: Run tests
      run: just test-all

    # Full meson test log on failure (see Linux job comment).
    - name: Upload test log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-testlog-macos
        path: build/meson-logs/testlog.txt

    # The menu-table drift check. This is the only job that runs it, because
    # it is the only place the two-table hazard exists: the macOS table is
    # compiled in only under __APPLE__, so off macOS the check compares the
    # portable table with itself and can never fail. It needs the GUI binary,
    # which is why it sits after `just build` rather than next to `just check`.
    - name: Check menu tables (GUI self-check)
      run: just check-gui

    - name: Strip binaries
      run: strip -x build/burrtools build/burrTxt build/burrTxt2
    
    - name: Extract version
      id: version
      run: |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
    
    - name: Create macOS App Bundle and DMG
      run: |
        chmod +x scripts/create-macos-bundle.sh
        ./scripts/create-macos-bundle.sh
    
    - name: Package macOS binaries
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        mkdir -p artifacts/macos
        # Tag every artifact with the architecture it was built for. The macOS
        # runner is arm64, so these must not be published under bare or x86_64
        # names that Intel and Linux users would reasonably download.
        ARCH="$(uname -m)"
        # Copy DMG if it exists
        if [ -f "BurrTools-${VERSION}-macos-${ARCH}.dmg" ]; then
          cp "BurrTools-${VERSION}-macos-${ARCH}.dmg" artifacts/macos/
        fi
        # Copy command-line tools
        cp build/burrTxt "artifacts/macos/burrTxt-${VERSION}-macos-${ARCH}"
        cp build/burrTxt2 "artifacts/macos/burrTxt2-${VERSION}-macos-${ARCH}"
        # Copy app bundle if it exists
        if [ -d "BurrTools.app" ]; then
          zip -r "artifacts/macos/BurrTools-${VERSION}-macos-${ARCH}-app.zip" BurrTools.app
        else
          # Fallback: create tar.gz with binaries and examples
          mkdir -p temp-macos
          cp build/burrtools build/burrTxt build/burrTxt2 temp-macos/
          cp -r examples temp-macos/
          tar czf "artifacts/macos/burrtools-${VERSION}-macos-${ARCH}.tar.gz" -C temp-macos .
        fi
    
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-macos
        path: artifacts/macos/*

  # burrtools-qt, the redesigned Qt 6 Quick GUI (src/qtgui, design-spec/).
  # Three jobs, one per platform, because each gets Qt differently. They build
  # the whole project with -Dqt_gui=enabled -- so a missing Qt fails loudly
  # instead of being skipped -- and run the fast suite, which includes the
  # Qt controller and QML tests (headless: QT_QPA_PLATFORM=offscreen, and on
  # Linux the render tests on Xvfb with software Vulkan, see qt-linux).
  #
  # meson comes from pip: qt.qml_module() needs meson >= 1.7 and the apt
  # meson is older.
  #
  # Each job also packages a self-contained preview build
  # (scripts/package-qt.sh) and uploads it as the workflow artifact
  # burrtools-qt-<os>, for trying the GUI without building it. The release
  # job does not pick these up: its download pattern names only the legacy builds.
  qt-linux:
    name: Qt GUI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build build-essential cmake libgl-dev libglu1-mesa-dev libpng-dev zlib1g-dev libcurl4-openssl-dev \
          libxkbcommon-dev libxkbcommon-x11-0 libegl1 libfontconfig1 libvulkan-dev libvulkan1 mesa-vulkan-drivers vulkan-tools \
          xvfb libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
          libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 imagemagick
        pip install --user "meson>=1.7"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        modules: 'qtshadertools'
        cache: true

    - name: Build
      run: |
        meson setup build-qt --buildtype=release --werror -Db_ndebug=true -Dqt_gui=enabled -Dpython=disabled
        ninja -C build-qt

    # Mesa's software Vulkan driver (lavapipe), found rather than named: its
    # manifest's file name has changed between Mesa releases. The summary
    # shows in the log which Vulkan device the render tests will get.
    - name: Find lavapipe
      run: |
        ls /usr/share/vulkan/icd.d/
        icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
        echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
        VK_DRIVER_FILES="$icd" vulkaninfo --summary

    - name: Self-check
      run: ./build-qt/burrtools-qt --self-check

    # The render tests draw through Vulkan on Mesa's software lavapipe, the
    # only driver offered (VK_DRIVER_FILES), and must not skip. Vulkan needs
    # an instance from a windowing platform plugin, which the headless
    # "offscreen" one cannot provide, so test_qtgui runs as "xcb" on Xvfb's
    # in-memory screen (BURRTOOLS_TEST_QPA); the QML tests stay offscreen.
    - name: Test
      env:
        BURRTOOLS_TEST_QPA: xcb
        BURRTOOLS_OFFSCREEN_RHI: vulkan
        BURRTOOLS_REQUIRE_GPU_TESTS: '1'
        VK_LOADER_DEBUG: error
      run: xvfb-run -a meson test -C build-qt --suite fast --print-errorlogs

    - name: Upload the test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qt-testlog-linux
        path: build-qt/meson-logs/testlog.txt
        if-no-files-found: ignore

    # The gallery's grabs: there are no Linux reference images yet, so the
    # snapshot checks skip and these are what to commit as
    # test/qtgui/snapshots/linux (and, after a failure, the diffs).
    - name: Upload gallery grabs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gallery-snapshots-linux
        path: build-qt/test/qtgui/snapshots
        if-no-files-found: ignore

    # An AppImage (linuxdeploy + its Qt plugin). New, so a packaging problem
    # does not fail the job; the build and the tests above decide that.
    - name: Package a preview AppImage (not yet required)
      id: package
      continue-on-error: true
      run: bash scripts/package-qt.sh build-qt artifacts/qt

    - name: Upload the preview build
      if: steps.package.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-qt-linux
        path: artifacts/qt/*.AppImage
        retention-days: 30

  qt-windows:
    name: Qt GUI (Windows, MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-meson
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-python
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-declarative
          mingw-w64-ucrt-x86_64-qt6-shadertools
          mingw-w64-ucrt-x86_64-qt6-svg
          mingw-w64-ucrt-x86_64-qt6-tools
          zip

    # -Ddxbc=enabled: the Direct3D shaders compiled by the runner's Windows
    # SDK fxc, so no start-up compiles HLSL; the build fails rather than
    # quietly shipping source if fxc is not found
    - name: Build
      run: |
        meson setup build-qt --buildtype=release --werror -Db_ndebug=true -Dqt_gui=enabled -Dpython=disabled -Ddxbc=enabled
        ninja -C build-qt

    - name: Self-check
      run: ./build-qt/burrtools-qt.exe --self-check

    # The tests by name rather than the whole fast suite: burrtxt2_cli_smoke
    # has only ever run on Linux and macOS (the cross-compiled Windows job
    # skips it) and its solver runs do not finish within its limits on a
    # native Windows build. That is unrelated to the GUI and tracked apart.
    # The render tests use Direct3D 11's WARP software rasteriser, which every
    # Windows has, so they must run rather than skip. The gallery's reference
    # images exist for Windows (test/qtgui/snapshots/windows), so a missing
    # one fails too.
    - name: Test
      env:
        BURRTOOLS_REQUIRE_GPU_TESTS: '1'
        BURRTOOLS_REQUIRE_SNAPSHOTS: '1'
      run: meson test -C build-qt --print-errorlogs fast qtgui qtgui_qml qtgui_gallery_150 qtgui_gallery_200 qtgui_smoke

    # grabs that did not match their reference, with the reference and a diff
    - name: Upload the test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qt-testlog-windows
        path: build-qt/meson-logs/testlog.txt
        if-no-files-found: ignore

    - name: Upload gallery differences
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gallery-snapshots-windows
        path: build-qt/test/qtgui/snapshots
        if-no-files-found: ignore

    # burrtools-qt.exe with Qt (windeployqt) and the MSYS2 libraries it
    # needs, plus a qt.conf and the examples: unzip and run, nothing to install
    - name: Package a preview build
      run: bash scripts/package-qt.sh build-qt artifacts/qt

    - name: Upload the preview build
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-qt-windows
        path: artifacts/qt/*.zip
        retention-days: 30

  qt-macos:
    name: Qt GUI (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install dependencies
      run: brew install meson ninja

    # The official Qt binaries, built for macOS 13 and later, so the program
    # and the preview app run on its minimum (qt_macos_deployment_target,
    # macOS 14). Homebrew's Qt would target the runner's own macOS instead.
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.*'
        modules: 'qtshadertools'
        cache: true

    - name: Build
      run: |
        meson setup build-qt --buildtype=release --werror -Db_ndebug=true -Dqt_gui=enabled -Dpython=disabled
        ninja -C build-qt

    - name: Self-check
      run: ./build-qt/burrtools-qt --self-check

    # The render tests try Metal and skip where the runner offers none (not
    # yet known for these VMs; the test log says which backend was used).
    # The gallery's reference images exist for macOS
    # (test/qtgui/snapshots/macos), so a missing one fails too.
    - name: Test
      env:
        BURRTOOLS_REQUIRE_SNAPSHOTS: '1'
      run: meson test -C build-qt --suite fast --print-errorlogs

    # The suites run offscreen, where AppKit draws no NSCursor image and the
    # system-arrow test skips: run it once on the window server, so
    # systempointer_mac.mm is exercised, not only compiled. The other test
    # classes report the function as not found, so the exit status says
    # nothing: TestEditor's own line does.
    - name: The system's arrow (cocoa)
      run: |
        ./build-qt/test/qtgui/test_qtgui -platform cocoa theCursorsDrawOnTheSystemsArrow > "$RUNNER_TEMP/arrow.txt" 2>&1 || true
        grep 'TestEditor::' "$RUNNER_TEMP/arrow.txt"
        grep -q 'PASS   : TestEditor::theCursorsDrawOnTheSystemsArrow()' "$RUNNER_TEMP/arrow.txt"

    - name: Upload the test log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qt-testlog-macos
        path: build-qt/meson-logs/testlog.txt
        if-no-files-found: ignore

    # grabs that did not match their reference, with the reference and a diff
    - name: Upload gallery differences
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gallery-snapshots-macos
        path: build-qt/test/qtgui/snapshots
        if-no-files-found: ignore

    # burrtools-qt.app made by macdeployqt (unsigned: open it with
    # right-click > Open). New, so a packaging problem does not fail the job.
    - name: Package a preview app (not yet required)
      id: package
      continue-on-error: true
      run: bash scripts/package-qt.sh build-qt artifacts/qt

    - name: Upload the preview build
      if: steps.package.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: burrtools-qt-macos
        path: artifacts/qt/*.zip
        retention-days: 30

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get version
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    # Everything under `artifacts/` becomes a release asset, so only the
    # legacy platform builds are downloaded: a tag run also uploads the docs'
    # Pages artifact, test logs on failure, coverage, gallery grabs and the
    # Qt preview builds (burrtools-qt-<os>, which this pattern does not match).
    - name: Download platform artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: burrtools-{linux,windows,macos}
        path: artifacts
    
    - name: Generate release notes
      id: release_notes
      run: |
        # Extract release notes from NEWS file
        awk '/^-{5,}/{if(++count==1)next; if(count==2)exit} count==1' NEWS > notes.md
        echo "" >> notes.md
        echo "## Downloads" >> notes.md
        echo "" >> notes.md
        echo "See the Assets section below for platform-specific downloads." >> notes.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: BurrTools ${{ steps.get_version.outputs.version }}
        body_path: notes.md
        draft: false
        prerelease: false
        files: |
          artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
